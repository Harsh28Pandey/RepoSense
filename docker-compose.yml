version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: reposense-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: reposense-redis
    ports:
      - "6379:6379"

  server:
    build: ./server
    container_name: reposense-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/reposense
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
      - redis

  client:
    build: ./client
    container_name: reposense-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
